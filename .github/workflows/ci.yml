name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python validation and PDF smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and audit tool
        run: python -m pip install -r requirements.txt pip-audit

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Generate sample PDFs
        run: |
          cp examples/example_input.csv input.csv
          python src/generate_envelopes.py
          test -s C5_ZONE_2.pdf
          test -s C5_ZONE_3.pdf

